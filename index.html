<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Tije | Katalog Buku Tri Tjahyono</title>
<meta name="description" content="Katalog Buku Tije - karya Tri Tjahyono. Inspirasi, Edukasi, Transformasi.">
<style>
:root{--navy:#061b3a;--blue:#0b63ff;--cyan:#12bff3;--gold:#f6b21a;--soft:#f4f8ff;--text:#172033;--muted:#667085;--line:#e4ecf8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff}a{text-decoration:none;color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);border-bottom:1px solid #e8eef8}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;gap:14px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy)}.logoimg{width:74px;height:auto;display:block}.brandtext{line-height:1.18}.brandtext strong{font-size:21px;color:var(--navy)}.brandtext small{color:var(--muted);font-size:12px;font-weight:700}.nav a.navlink{font-size:14px;color:var(--muted);margin-left:12px;font-weight:800}.nav a.navlink:hover{color:var(--blue)}
.hero{background:linear-gradient(135deg,#eef6ff,#fff 55%,#f8fbff);padding:58px 0 42px;border-bottom:1px solid #e8eef8}.heroGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}.badge{display:inline-block;padding:8px 13px;border-radius:999px;background:#fff;border:1px solid #dce8ff;color:var(--blue);font-weight:900;font-size:13px}h1{font-size:clamp(42px,7vw,76px);line-height:.95;margin:18px 0 10px;color:var(--navy);letter-spacing:-2px}.motto{font-weight:900;color:var(--navy);font-size:18px}.motto span{color:var(--gold)}.hero p{color:var(--muted);line-height:1.75;font-size:18px;max-width:680px}.btn{display:inline-block;margin:10px 8px 0 0;padding:13px 18px;border-radius:999px;font-weight:900;border:1px solid #d8e5f8;background:#fff}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:0}
.heroCard{background:#fff;border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 18px 44px rgba(6,27,58,.12)}.bookVisual{height:250px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#eef6ff,#ffffff);border:1px solid #dce8ff;position:relative;overflow:hidden}.bookVisual:after{content:"✦";position:absolute;right:32px;top:20px;color:var(--gold);font-size:44px}.bookVisual img{width:88%;max-width:390px;height:auto;display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stats div{background:var(--soft);border-radius:18px;padding:13px;text-align:center}.stats b{display:block;color:var(--blue);font-size:24px}.stats small{color:var(--muted);font-size:12px;font-weight:700}
section{padding:42px 0}h2{color:var(--navy);font-size:32px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.6}.sectionTop{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.searchBox{max-width:330px;width:100%}.searchBox input{width:100%;border:1px solid #d8e5f8;border-radius:999px;padding:12px 15px;font:inherit}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 22px}.filter{border:1px solid #d8e5f8;background:#fff;color:var(--navy);padding:10px 14px;border-radius:999px;font-weight:900;cursor:pointer}.filter.active{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(6,27,58,.07);display:flex;flex-direction:column;min-height:440px;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(6,27,58,.12)}.cover{height:260px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:56px;background:#f7f9fc;border:1px solid #e8eef8;margin-bottom:14px;overflow:hidden;padding:10px}.cover img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center}.label{display:inline-block;background:#eaf3ff;color:var(--blue);border-radius:999px;padding:5px 8px;font-weight:900;font-size:12px;margin:0 4px 6px 0}.tag{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tag span{padding:6px 10px;border-radius:999px;background:#fff6df;color:#8a5a00;font-size:12px;font-weight:900}.card h3{margin:0 0 9px;color:var(--navy);font-size:19px;line-height:1.28}.card .subtitle{color:var(--blue);font-weight:800;font-size:13px;margin:0 0 8px}.card p{margin:0 0 12px;color:#475467;line-height:1.6;font-size:14px}.meta{margin-top:auto;padding-top:12px;border-top:1px solid #eef2f7;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini{padding:9px 11px;border-radius:999px;background:var(--soft);color:var(--blue);font-size:13px;font-weight:900;border:1px solid #dce8ff}.buy{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;border:0}.appbtn{background:linear-gradient(135deg,#10b981,#22c55e);color:#fff;border:0}
.publisher{display:inline-block;margin:2px 0 10px;color:#475467;font-size:13px;font-weight:800}.quoteBook{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--gold);background:#fffaf0;color:#624200;border-radius:10px;font-size:13px;line-height:1.5}.best{background:#fff0d8;color:#9a5b00}.free{background:#eafff6;color:#047857}.about{background:var(--soft);border-top:1px solid #e8eef8;border-bottom:1px solid #e8eef8}.aboutBox{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;display:grid;grid-template-columns:140px 1fr;gap:22px;align-items:center}.aboutLogo{width:140px;height:auto;display:block}.quote{color:#fff;background:linear-gradient(135deg,var(--navy),#0b3d91);border-radius:28px;padding:28px;margin-top:18px}.quote p{margin:0;font-size:20px;line-height:1.6}.quote small{display:block;margin-top:12px;color:#d5e7ff;font-weight:900}footer{padding:28px 0;text-align:center;color:var(--muted);font-size:14px}.footerLogo{width:180px;max-width:80%;height:auto;display:block;margin:0 auto 12px}
@media(max-width:900px){.heroGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.heroCard{order:-1}.sectionTop{display:block}.searchBox{margin-top:14px;max-width:none}}@media(max-width:640px){.nav nav{display:none}.logoimg{width:60px}.brandtext strong{font-size:18px}.brandtext small{display:none}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.aboutBox{grid-template-columns:1fr;text-align:center}.aboutLogo{margin:auto}.hero{padding-top:34px}.card{min-height:auto}}

<!-- TANYA OM TIJE FINAL UI START -->
<style>
  #tanyaOmTijeTrigger {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 9998;
    width: min(360px, 42vw);
    cursor: pointer;
    border: 0;
    padding: 0;
    background: transparent;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,.22));
    transition: transform .18s ease, filter .18s ease;
  }
  #tanyaOmTijeTrigger:hover {
    transform: translateY(-4px) scale(1.015);
    filter: drop-shadow(0 14px 24px rgba(0,0,0,.28));
  }
  #tanyaOmTijeTrigger img {
    display: block;
    width: 100%;
    height: auto;
  }

  #tanyaOmTijeModal {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(8, 18, 35, .58);
    backdrop-filter: blur(5px);
  }
  #tanyaOmTijeModal.is-open { display: flex; }

  #tanyaOmTijePanel {
    width: min(1080px, 96vw);
    height: min(820px, 92vh);
    background: #fff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 28px 80px rgba(0,0,0,.32);
    position: relative;
  }
  #tanyaOmTijeClose {
    position: absolute;
    top: 10px;
    right: 12px;
    z-index: 3;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.94);
    color: #17324d;
    font-size: 24px;
    line-height: 38px;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0,0,0,.16);
  }
  #tanyaOmTijeFrame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #fff;
  }

  @media (max-width: 700px) {
    #tanyaOmTijeTrigger {
      right: 12px;
      bottom: 12px;
      width: min(255px, 72vw);
    }
    #tanyaOmTijeModal {
      padding: 0;
    }
    #tanyaOmTijePanel {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
    }
    #tanyaOmTijeClose {
      top: 8px;
      right: 8px;
    }
  }
</style>

<button id="tanyaOmTijeTrigger" type="button" aria-label="Tanya Om Tije">
  <img src="assets/tanya-om-tije-badge.png" alt="Tanya Om Tije — Ngobrol, Bertanya, Berbagi Inspirasi">
</button>

<div id="tanyaOmTijeModal" role="dialog" aria-modal="true" aria-label="Tanya Om Tije">
  <div id="tanyaOmTijePanel">
    <button id="tanyaOmTijeClose" type="button" aria-label="Tutup">×</button>
    <iframe id="tanyaOmTijeFrame" title="Tanya Om Tije" src="tanya.html"></iframe>
  </div>
</div>

<script>
(function() {
  const trigger = document.getElementById('tanyaOmTijeTrigger');
  const modal = document.getElementById('tanyaOmTijeModal');
  const close = document.getElementById('tanyaOmTijeClose');

  function openTanya() {
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  function closeTanya() {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  trigger.addEventListener('click', openTanya);
  close.addEventListener('click', closeTanya);

  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeTanya();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) closeTanya();
  });
})();
</script>
<!-- TANYA OM TIJE FINAL UI END -->

</body>
</html>
